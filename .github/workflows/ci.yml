name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,pipeline]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Run tests
        run: pytest

  test-debian:
    # Debian 12 (bookworm) - Kali is Debian-based and covered by this
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y python3 python3-venv python3-pip git
      - name: Create virtualenv
        run: python3 -m venv .venv
      - name: Install project
        run: .venv/bin/pip install -e ".[dev,pipeline]"
      - name: Ruff check
        run: .venv/bin/ruff check .
      - name: Ruff format check
        run: .venv/bin/ruff format --check .
      - name: Run tests
        run: .venv/bin/pytest
        env:
          RUN_NETWORK_TESTS: "0"

  test-arch:
    # Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm python python-pip git
      - name: Create virtualenv
        run: python -m venv .venv
      - name: Install project
        run: .venv/bin/pip install -e ".[dev,pipeline]"
      - name: Ruff check
        run: .venv/bin/ruff check .
      - name: Ruff format check
        run: .venv/bin/ruff format --check .
      - name: Run tests
        run: .venv/bin/pytest
        env:
          RUN_NETWORK_TESTS: "0"