[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otinstaller"
version = "0.1.0"
description = "Install, run and update command line tools by name"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "otinstaller contributors"}]
keywords = ["tools", "cli", "installer", "package-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer==0.27.2",
    "click>=8.0.0",
    "rich>=13.8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/OSINTVerseHQ/OTinstaller"
Repository = "https://github.com/OSINTVerseHQ/OTinstaller"
Documentation = "https://github.com/OSINTVerseHQ/OTinstaller-Docs"
Issues = "https://github.com/OSINTVerseHQ/OTinstaller/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.10",
]
pipeline = [
    "requests",
]

[project.scripts]
otinstaller = "otinstaller.cli:app"
ot = "otinstaller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/otinstaller"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (set RUN_NETWORK_TESTS=1 to run)",
]
asyncio_mode = "auto"
