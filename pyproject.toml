[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otinstaller"
version = "0.0.1"
description = "Install, run and update command line tools by name"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "otinstaller contributors"}]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
pipeline = [
    "requests",
]

[project.scripts]
otinstaller = "otinstaller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/otinstaller"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (set RUN_NETWORK_TESTS=1 to run)",
]
asyncio_mode = "auto"